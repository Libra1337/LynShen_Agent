name: Release

# Build and publish a GitHub Release with installers for macOS, Linux and
# Windows whenever a version tag (e.g. v0.4.16) is pushed. Run by hand, it
# only builds the macOS app (no release) to check the pipeline.
#
# Repo secrets used:
#   TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) — updater artifact signing (required
#     for auto-update; the matching pubkey lives in tauri.conf.json).
#   LYNSHEN_CLI_TOKEN — a token that can clone the private LynShen-CLI repo,
#     from which the sidecar engine is built (desktop + engine update together).
#   APPLE_CERTIFICATE(_PASSWORD) — optional; macOS keeps granted permissions
#     across updates only while the signing identity stays the same.
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # macOS Apple Silicon, Linux x86_64, Windows x86_64; a manual run
        # builds macOS only.
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch'
          && '[{"os":"macos-latest","target":"aarch64-apple-darwin"}]'
          || '[{"os":"macos-latest","target":"aarch64-apple-darwin"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            build-essential file libssl-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # The app ships the LynShen CLI engine as a sidecar (see
      # src-tauri/src/app_cli.rs and tauri.bundle.conf.json), so a desktop
      # update carries the matching engine: the two stay in sync.
      - name: Build the LynShen CLI sidecar
        shell: bash
        env:
          CLI_TOKEN: ${{ secrets.LYNSHEN_CLI_TOKEN }}
        run: |
          git clone --depth 1 https://oauth2:${CLI_TOKEN}@github.com/Libra1337/LynShen-CLI.git /tmp/lynshen-cli
          cd /tmp/lynshen-cli
          git submodule update --init
          cargo build --release
          ext=""; [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ] && ext=".exe"
          cd "$GITHUB_WORKSPACE"
          mkdir -p src-tauri/binaries
          cp "/tmp/lynshen-cli/target/release/lynshen${ext}" "src-tauri/binaries/lynshen-cli-${{ matrix.target }}${ext}"

      # macOS builds sign with a fixed self-signed certificate (not
      # notarized) when the secret is configured; without it the build still
      # proceeds unsigned.
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain src-tauri/macos-signing-cert.pem
          security find-identity -v -p codesigning "$keychain"
          rm "$RUNNER_TEMP/signing.p12"

      # tauri-action runs beforeBuildCommand (pnpm build), bundles the app with
      # the lynshen sidecar and uploads the installers to a release named after
      # the tag. With TAURI_SIGNING_PRIVATE_KEY set it additionally signs the
      # updater bundles (.sig) and generates latest.json, which installed
      # clients poll (plugins.updater in tauri.conf.json).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ (runner.os == 'macOS' && env.APPLE_CERTIFICATE != '') && 'LynShen Self-Signed' || '' }}
        with:
          # A manual run builds without publishing.
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.bundle.conf.json
          releaseBody: |
            Installers for macOS (Apple Silicon), Linux (x64) and Windows
            (x64) with the LynShen CLI engine bundled. The app updates
            itself from these releases.

      - name: Keep the manual build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: src-tauri/target/release/bundle/macos/*.app.tar.gz
